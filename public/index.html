<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事故報告書AI ver.0.1.10</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    #aiResult {
      white-space: pre-line;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>事故報告書AI ver.0.1.10</h1>
    <p>Excelを読み込み、AIが確認したほうがよい点を整理します。</p>

    <section>
      <h2>① Excelを選択</h2>
      <input id="excelFile" type="file" accept=".xlsx,.xls">
      <button id="readExcel" type="button">Excelを読み込む</button>
      <p id="excelResult"></p>
    </section>

    <section id="preview" hidden>
      <h2>② 読み取り結果</h2>
      <h3>項目ごとの選択結果</h3>
      <div id="checkedItems"></div>

      <h3>入力されている主な内容</h3>
      <div id="textItems"></div>

      <div id="aiArea">
        <h3>③ AIチェック</h3>
        <p>AIは原因や再発防止策を決めず、確認したほうがよい点を整理します。</p>
        <button id="aiCheck" type="button" disabled>🤖 AIチェック</button>
        <div id="aiResult"></div>
      </div>
    </section>
  </main>

  <script src="/app.js?v=20260915-10"></script>
</body>
</html>
