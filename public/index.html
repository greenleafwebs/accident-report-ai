<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事故報告書AI ver.0.1.18</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    #privacyNotice {
      padding: 12px 14px;
      margin: 16px 0 24px;
      border: 1px solid #d6e8d0;
      border-radius: 8px;
      background: #f5faf4;
    }
    #excelFile {
      display: none;
    }
    #excelFileLabel {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid #999;
      border-radius: 4px;
      background: #f3f3f3;
      cursor: pointer;
    }
    #selectedFileName {
      margin: 8px 0;
      overflow-wrap: anywhere;
    }
    #aiResult {
      white-space: pre-line;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>事故報告書AI ver.0.1.18</h1>
    <p>Excelを読み込み、AIが確認したほうがよい点を整理します。</p>

    <div id="privacyNotice">
      <strong>🔒 個人情報について</strong>
      <p>■個人を直接特定できる情報（氏名・住所・電話番号）はGeminiへ送信しません。</p>
      <p>■医療機関名・診断名・事故後の健康状態など、事故内容の確認に必要な情報はAIチェックに使用します。</p>
    </div>

    <section>
      <h2>① Excelを選択</h2>
      <label id="excelFileLabel" for="excelFile">ファイルを選択</label>
      <input id="excelFile" type="file" accept=".xlsx,.xls">
      <div id="selectedFileName"></div>
      <button id="readExcel" type="button">Excelを読み込む</button>
      <p id="excelResult"></p>
    </section>

    <section id="preview" hidden>
      <h2>② 読み取り結果</h2>
      <h3>項目ごとの選択結果</h3>
      <div id="checkedItems"></div>

      <h3>入力されている主な内容</h3>
      <div id="textItems"></div>

      <div id="aiArea">
        <h3>③ AIチェック</h3>
        <p>AIは原因や再発防止策を決めず、確認したほうがよい点を整理します。</p>
        <button id="aiCheck" type="button" disabled>🤖 AIチェック</button>
        <div id="aiResult"></div>
      </div>
    </section>
  </main>

  <script src="/app.js?v=20260915-18"></script>
</body>
</html>
